name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: forest-board-friends-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
      - name: Build signed release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease && cp app/build/outputs/apk/release/app-release.apk ForestBoardFriends-${GITHUB_REF_NAME}.apk
      - name: Publish APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ForestBoardFriends-${GITHUB_REF_NAME}.apk --title "숲속 보드 친구들 ${GITHUB_REF_NAME}" --generate-notes
